version: 2

updates:
  # Keep the pinned action SHAs current. Wrangler is pinned in publish.yml and bumped by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"
