name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the title is one type(scope) line
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|ci|chore|refactor|perf|build|style|revert)\([a-z0-9._/-]+\): [^ ].*$'
          if printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo "Title OK: $TITLE"
          else
            echo "::error::The PR title becomes the squash commit on main. Use 'type(scope): short description', for example 'fix(normalize): keep stray percent signs'."
            exit 1
          fi
